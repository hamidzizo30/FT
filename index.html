<!DOCTYPE html>
<html lang="en" data-theme="ucl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0c14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Friday League</title>
<meta name="description" content="eFootball tournaments with friends">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="icon" type="image/png" href="favicon-48.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Friday League">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ================= THEMES ================= */
:root[data-theme="ucl"]{
  --bg:#0b0c14; --bg2:#12131d; --card:#151724; --card2:#1c1f30;
  --line:rgba(255,255,255,.07); --txt:#f2f3f8; --mut:#7d8197;
  --a1:#3d63ff; --a2:#a13dff; --a3:#36d6ff;
  --grad:#5b5bff;
  --glow:none;
  --win:#2fe39a; --draw:#c9cfee; --loss:#ff5a7a;
}
:root[data-theme="akira"]{
  --bg:#0a0a0a; --bg2:#131313; --card:#161616; --card2:#1f1f1f;
  --line:rgba(255,255,255,.07); --txt:#f4f4f4; --mut:#858585;
  --a1:#ff2323; --a2:#b30012; --a3:#ff6a3d;
  --grad:#e5252a;
  --glow:none;
  --win:#2fe39a; --draw:#d8cccc; --loss:#ff6a6a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;touch-action:pan-x pan-y;-webkit-text-size-adjust:100%;text-size-adjust:100%}
button,a,[data-a]{touch-action:manipulation}
select,input,textarea{font-size:16px}
body{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--txt);background:var(--bg);min-height:100%;overscroll-behavior-y:none;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select{font:inherit;color:var(--txt)}
.wrap{max-width:480px;margin:0 auto;padding:0 16px calc(96px + env(safe-area-inset-bottom));min-height:100vh}
.h{font-family:Inter,system-ui,sans-serif;letter-spacing:-.02em}
.it{font-style:normal}
.mut{color:var(--mut)}
.small{font-size:12px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.center{text-align:center}
.hidden{display:none!important}

/* header */
.top{position:sticky;top:0;z-index:20;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;margin:0 -16px 6px;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);background:color-mix(in srgb,var(--bg) 70%,transparent);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:9px;background:#000;border:1px solid var(--line);display:grid;place-items:center}
.brand .t{font-size:18px;font-weight:700;line-height:1}
.brand .s{font-size:11px;color:var(--mut);margin-top:3px}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);position:relative}
.badge{position:absolute;top:-3px;right:-3px;min-width:16px;height:16px;border-radius:8px;background:var(--a1);font-size:10px;font-weight:600;display:grid;place-items:center;padding:0 4px;color:#fff}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin:12px 0;}
.hero{position:relative;overflow:hidden}

.hero > *{position:relative;z-index:1}
.sec{margin:24px 2px 8px;font-size:13px;color:var(--mut);font-weight:600}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:11px;font-weight:600;background:var(--card2);border:1px solid var(--line)}
.pill.live{background:transparent}
.pill.gold{background:transparent;border-color:rgba(240,199,94,.4);color:#f0c75e}
.dot{width:6px;height:6px;border-radius:50%;background:var(--win);animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.35}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 20px;border-radius:14px;font-weight:600;color:#fff;background:var(--grad);box-shadow:var(--glow);width:100%;font-size:15px}
.btn.sec2{background:var(--card2);box-shadow:none;border:1px solid var(--line)}
.btn.ghost{background:transparent;box-shadow:none;border:1px solid var(--line)}
.btn.danger{background:linear-gradient(135deg,#ff3b5c,#a1002a);box-shadow:none}
.btn.sm{height:38px;font-size:13px;padding:0 14px;border-radius:12px;width:auto}
.btn:active,.iconbtn:active,.tap:active{transform:scale(.97)}
.progress{height:6px;border-radius:6px;background:rgba(255,255,255,.08);overflow:hidden}
.progress > i{display:block;height:100%;background:var(--grad);border-radius:6px}

/* avatars */
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:15px;flex:none;color:#fff}
.av.lg{width:60px;height:60px;font-size:22px}
.av.xl{width:84px;height:84px;font-size:30px}
.av.sm{width:28px;height:28px;font-size:11px}
.duo{display:flex;flex:none}
.duo .av{box-shadow:0 0 0 2px var(--bg)}
.duo .av + .av{margin-left:-10px}
.duo.lg .av + .av{margin-left:-20px}
select.inp{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 20px) 22px,calc(100% - 15px) 22px;background-size:5px 5px;background-repeat:no-repeat}
select.inp option{background:var(--bg2);color:var(--txt)}
.team{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:14px;background:var(--card);border:1px solid var(--line);margin:6px 0;font-size:14px}
.team .chip{padding:6px 12px}

/* match */
.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin:14px 0}
.vs .p{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;min-width:0}
.vs .p .n{font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.vs .mid{font-weight:500;font-size:15px;padding:0 6px;color:var(--mut)}
.vs .score{font-size:40px;font-weight:700;color:var(--txt)}
.mrow{display:grid;grid-template-columns:1fr 64px 1fr;align-items:center;gap:6px;padding:12px;border-radius:14px;background:var(--card);border:1px solid var(--line);margin:8px 0}
.mrow .side{display:flex;align-items:center;gap:8px;min-width:0;font-weight:600;font-size:14px}
.mrow .side span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow .side.r{justify-content:flex-end;text-align:right}
.mrow .sc{text-align:center;font-weight:700;font-size:17px;border-radius:10px;padding:2px 0}
.mrow .sc.pending{font-size:12px;color:var(--mut);font-weight:500;background:rgba(255,255,255,.04)}
.mrow.mine{border-color:color-mix(in srgb,var(--a1) 45%,transparent)}
.mrow .w{color:var(--txt)} .mrow .l{color:var(--mut)}
.mrow.tap{cursor:pointer}

/* table */
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:11px;color:var(--mut);font-weight:500;padding:6px 4px;text-align:center}
td{padding:10px 4px;text-align:center;border-top:1px solid var(--line)}
td.pl{text-align:left}
th.pl{text-align:left}
td.pts{font-weight:700;font-size:15px}

tr.me td.pl b{color:var(--a1)}
.pos{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:7px;font-weight:700;font-size:12px;background:rgba(255,255,255,.06)}
tr.lead .pos{background:var(--a1)}
.form{display:flex;gap:3px;justify-content:center}
.form i{width:8px;height:8px;border-radius:50%}
.fW{background:var(--win)} .fD{background:var(--draw)} .fL{background:var(--loss)}

/* chips & segmented */
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:13px;font-weight:600;white-space:nowrap}
.chip.on{background:var(--a1);border-color:transparent;color:#fff}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:14px;padding:4px}
.seg button{padding:10px 4px;border-radius:10px;font-weight:700;font-size:13px;color:var(--mut)}
.seg button.on{background:var(--card2);color:var(--txt)}


/* list items */
.li{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;background:var(--card);border:1px solid var(--line);margin:8px 0;cursor:pointer}
.li .nm{font-weight:700}
.trophy{display:inline-flex;align-items:center;gap:4px;font-weight:600;color:#f0c75e;font-size:14px}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:14px;padding:10px 4px;text-align:center}
.stat b{display:block;font-size:20px;font-weight:700}
.stat span{font-size:11px;color:var(--mut)}
.h2hbar{display:flex;height:10px;border-radius:6px;overflow:hidden;background:rgba(255,255,255,.06);margin:10px 0}
.h2hbar i{display:block;height:100%}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:8px 10px calc(8px + env(safe-area-inset-bottom));
  background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line)}
.nav .in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.nav button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0;font-size:11px;font-weight:500;color:var(--mut)}
.nav button.on{color:var(--txt)}
.nav button.on svg{color:var(--a1)}

/* modal */
.modal{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);animation:fade .2s}
.sheet{width:100%;max-width:480px;max-height:92vh;overflow:auto;background:var(--bg2);border:1px solid var(--line);border-bottom:0;border-radius:26px 26px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom));animation:up .25s ease}
.grab{width:42px;height:5px;border-radius:3px;background:rgba(255,255,255,.18);margin:4px auto 14px}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@keyframes fade{from{opacity:0}}
.field{display:block;margin:12px 0}
.field label{display:block;font-size:13px;color:var(--mut);margin-bottom:6px;font-weight:500}
.inp{width:100%;height:50px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.05);padding:0 14px;font-size:16px;outline:none}
.inp:focus{border-color:var(--a2);box-shadow:0 0 0 3px color-mix(in srgb,var(--a2) 25%,transparent)}
.stepper{display:flex;flex-direction:column;align-items:center;gap:8px}
.stepper .num{font-weight:700;font-size:56px;line-height:1;width:90px;text-align:center;background:transparent;border:0;outline:none}
.stepper .b{width:48px;height:40px;border-radius:12px;background:var(--card2);border:1px solid var(--line);font-size:22px;font-weight:700}

/* toast */
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translateX(-50%);z-index:60;max-width:440px;width:calc(100% - 28px);
  background:var(--bg2);border:1px solid color-mix(in srgb,var(--a2) 50%,transparent);border-radius:16px;padding:12px 14px;box-shadow:var(--glow),0 10px 30px rgba(0,0,0,.5);animation:drop .3s ease}
@keyframes drop{from{transform:translate(-50%,-20px);opacity:0}}

/* login */
.login{min-height:100vh;display:flex;flex-direction:column;padding:calc(30px + env(safe-area-inset-top)) 18px 30px;max-width:480px;margin:0 auto}
.ugrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}
.ucard{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 6px;border-radius:18px;background:var(--card);border:1px solid var(--line);position:relative}
.ucard .nm{font-weight:700;font-size:14px}
.ucard .tag{position:absolute;top:8px;right:8px;width:6px;height:6px;border-radius:50%;background:var(--a1)}
.ucard .new{font-size:10px;color:var(--a3);font-weight:700;letter-spacing:.06em}
.bigtitle{font-size:34px;font-weight:700;line-height:1.05;margin:6px 0 4px}
.grad-t{color:var(--a1)}
.champ{border:1px solid rgba(240,199,94,.35)}
.champ .h{color:#f0c75e}
.err{color:var(--loss);font-size:13px;min-height:18px;margin-top:6px}
.empty{text-align:center;padding:30px 10px}
.empty .ic{font-size:44px;margin-bottom:8px}
.sync{font-size:11px;display:inline-flex;align-items:center;gap:5px}
.sync i{width:6px;height:6px;border-radius:50%;background:var(--mut)}
.sync.on i{background:var(--win);box-shadow:0 0 6px var(--win)}
.sync.off i{background:var(--loss)}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>
<div id="toast"></div>

<script>
/* =========================================================
   CONFIG — paste your Firebase Realtime Database URL here so
   every phone shares the same data (see README.md).
   Leave empty = data stays on this device only.
   ========================================================= */
const CONFIG = {
  firebaseURL: "https://fridaytournament-aa12f-default-rtdb.europe-west1.firebasedatabase.app"
};

const SEED_USERS = ["Mohamed","Hamid","Chellali","Yacine","Islam","Hicham","Redouane","Imad","Ghani"];
const ADMIN_SEED = "Mohamed";

/* ================= tiny helpers ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = (p="x") => p + "_" + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const slug = s => s.toLowerCase().normalize("NFD").replace(/[^a-z0-9]/g,"") || "user";
const fmtDate = t => t ? new Date(t).toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"}) : "";
const ago = t => { const s=(Date.now()-t)/1000; if(s<60) return "just now"; if(s<3600) return Math.floor(s/60)+"m ago"; if(s<86400) return Math.floor(s/3600)+"h ago"; return Math.floor(s/86400)+"d ago"; };

/* SHA-256 (pure JS so it behaves the same on every device, even over plain http) */
function sha256(ascii){
  function rr(v,a){return (v>>>a)|(v<<(32-a));}
  var mp=Math.pow,mw=mp(2,32),i,j,res="",words=[],bl=ascii.length*8;
  var hash=[],k=[],pc=0,comp={};
  for(var c=2;pc<64;c++){ if(!comp[c]){ for(i=0;i<313;i+=c) comp[i]=c; hash[pc]=(mp(c,.5)*mw)|0; k[pc++]=(mp(c,1/3)*mw)|0; } }
  ascii+="\x80"; while(ascii.length%64-56) ascii+="\x00";
  for(i=0;i<ascii.length;i++){ j=ascii.charCodeAt(i); words[i>>2]|=j<<((3-i)%4)*8; }
  words[words.length]=((bl/mw)|0); words[words.length]=bl;
  for(j=0;j<words.length;){
    var w=words.slice(j,j+=16),old=hash; hash=hash.slice(0,8);
    for(i=0;i<64;i++){
      var w15=w[i-15],w2=w[i-2],a=hash[0],e=hash[4];
      var t1=hash[7]+(rr(e,6)^rr(e,11)^rr(e,25))+((e&hash[5])^((~e)&hash[6]))+k[i]+(w[i]=(i<16)?w[i]:(w[i-16]+(rr(w15,7)^rr(w15,18)^(w15>>>3))+w[i-7]+(rr(w2,17)^rr(w2,19)^(w2>>>10)))|0);
      var t2=(rr(a,2)^rr(a,13)^rr(a,22))+((a&hash[1])^(a&hash[2])^(hash[1]&hash[2]));
      hash=[(t1+t2)|0].concat(hash); hash[4]=(hash[4]+t1)|0;
    }
    for(i=0;i<8;i++) hash[i]=(hash[i]+old[i])|0;
  }
  for(i=0;i<8;i++) for(j=3;j+1;j--){ var b=(hash[i]>>(j*8))&255; res+=((b<16)?0:"")+b.toString(16); }
  return res;
}
const hashPw = (userId,pw) => sha256(unescape(encodeURIComponent("fridayleague|"+userId+"|"+pw)));

const COLORS = [["#2c50ff","#8a2cff"],["#ff2d6f","#8a1cff"],["#00b7ff","#2c50ff"],["#ff7a18","#ff2d55"],["#13d88a","#0a8bd6"],["#a13dff","#ff3dbb"],["#ffb800","#ff4d00"],["#00e0c6","#6b3dff"],["#ff4040","#7a0019"],["#5b7cff","#00d4ff"]];
function avColor(id){ let h=0; for(const c of String(id)) h=(h*31+c.charCodeAt(0))>>>0; const [a,b]=COLORS[h%COLORS.length]; return a; }
function initials(n){ return esc((n||"?").trim().slice(0,2).toUpperCase()); }
function av(u, size=""){ if(!u) return `<div class="av ${size}" style="background:#333">?</div>`; return `<div class="av ${size}" style="background:${avColor(u.id)}">${initials(u.name)}</div>`; }

const ICON = {
  home:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>',
  table:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/><circle cx="4" cy="6" r=".5"/></svg>',
  ball:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m12 7 4 3-1.5 4.5h-5L8 10z"/><path d="M12 3v4M16 10l4.5-1.5M14.5 14.5 17 19M9.5 14.5 7 19M8 10 3.5 8.5"/></svg>',
  trophy:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg>',
  users:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="8" r="4"/><path d="M2 21a7 7 0 0 1 14 0"/><path d="M16 4a4 4 0 0 1 0 8M22 21a7 7 0 0 0-4-6.3"/></svg>',
  bell:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 8 3 8H3s3-1 3-8"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>',

/* ================= DATA LAYER =================
   One tree: { users:{}, tournaments:{}, notifs:{} }
   - Firebase mode: live sync via REST streaming (EventSource)
   - Local mode: localStorage                                    */
const LS_KEY = "fridayleague_db_v1";
let DB = {};
let ready = false;
let syncState = "local";
const REMOTE = (CONFIG.firebaseURL || localStorage.getItem("fl_firebase") || "").replace(/\/+$/,"");

function applyPath(path, val){
  const parts = path.split("/").filter(Boolean);
  if(!parts.length){ DB = (val && typeof val==="object") ? val : {}; return; }
  let o = DB;
  for(let i=0;i<parts.length-1;i++){
    if(typeof o[parts[i]] !== "object" || o[parts[i]] === null) o[parts[i]] = {};
    o = o[parts[i]];
  }
  const last = parts[parts.length-1];
  if(val === null || val === undefined) delete o[last]; else o[last] = val;
}
function saveLocal(){ if(!REMOTE) localStorage.setItem(LS_KEY, JSON.stringify(DB)); }

/* multi-path update: {"tournaments/t1/status":"finished", ...} */
async function dbUpdate(map){
  for(const [p,v] of Object.entries(map)) applyPath(p, clone(v));
  saveLocal(); render();
  if(REMOTE){
    try{
      const r = await fetch(REMOTE + "/.json", {method:"PATCH", body: JSON.stringify(map)});
      if(!r.ok) throw new Error(r.status);
    }catch(e){ toast("⚠️ Sync failed — check your connection"); }
  }
}
const clone = v => v===undefined ? null : JSON.parse(JSON.stringify(v));

function startData(){
  if(REMOTE){
    syncState = "connecting";
    const es = new EventSource(REMOTE + "/.json");
    es.addEventListener("put", e => {
      const {path, data} = JSON.parse(e.data);
      applyPath(path, data);
      syncState = "on";
      if(!ready){ ready = true; afterReady(); }
      onData();
    });
    es.addEventListener("patch", e => {
      const {path, data} = JSON.parse(e.data);
      for(const [k,v] of Object.entries(data||{})) applyPath((path==="/"?"":path)+"/"+k, v);
      onData();
    });
    es.onerror = () => { syncState = "off"; renderSyncDot(); };
    es.onopen = () => { syncState = "on"; renderSyncDot(); };
    setTimeout(()=>{ if(!ready){ toast("Can't reach the database. Check the Firebase URL."); } }, 8000);
  } else {
    try{ DB = JSON.parse(localStorage.getItem(LS_KEY)) || {}; }catch(e){ DB = {}; }
    ready = true; afterReady(); render();
    window.addEventListener("storage", e => { if(e.key===LS_KEY){ try{ DB = JSON.parse(e.newValue)||{}; }catch(_){} onData(); } });
  }
}
function afterReady(){
  if(!DB.users || !Object.keys(DB.users).length){
    const map = {};
    SEED_USERS.forEach((n,i) => { const id = "u_"+slug(n); map["users/"+id] = {id, name:n, isAdmin: n===ADMIN_SEED, order:i, createdAt:Date.now()}; });
    dbUpdate(map);
  }
}

/* ================= DOMAIN ================= */
const users = () => Object.values(DB.users||{}).sort((a,b)=>(a.order??0)-(b.order??0));
const U = id => (DB.users||{})[id];
const tournaments = () => Object.values(DB.tournaments||{}).sort((a,b)=>b.createdAt-a.createdAt);
const matchesOf = t => Object.values(t.matches||{}).sort((a,b)=>a.round-b.round || a.n-b.n);
const playersOf = t => (Array.isArray(t.players)?t.players:Object.values(t.players||{}));
const activeTs = () => tournaments().filter(t=>t.status==="active");

/* participants: a user (solo) or a team of 2 (duo) */
const isDuo = t => t.mode==="duo";
function members(t,pid){ if(!isDuo(t)) return [pid]; const tm=(t.teams||{})[pid]; return tm ? (Array.isArray(tm.members)?tm.members:Object.values(tm.members||{})) : []; }
function pName(t,pid){ return isDuo(t) ? members(t,pid).map(id=>U(id)?.name||"?").join(" & ") : (U(pid)?.name||"?"); }
function pAv(t,pid,size=""){
  if(!isDuo(t)) return av(U(pid),size);
  const [a,b]=members(t,pid); return `<div class="duo ${size}">${av(U(a),size)}${av(U(b),size)}</div>`;
}
const tUsers = t => isDuo(t) ? playersOf(t).flatMap(p=>members(t,p)) : playersOf(t);
const sideHas = (t,pid,u) => members(t,pid).includes(u);
function pairUp(ids){ const s=shuffle(ids), out=[]; for(let i=0;i+1<s.length;i+=2) out.push([s[i],s[i+1]]); return out; }

function shuffle(a){ a=[...a]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

/* round robin (circle method) */
function schedule(ids, cycles){
  let p = shuffle(ids); if(p.length%2) p.push(null);
  const n = p.length, base = [];
  for(let r=0;r<n-1;r++){
    const pairs=[];
    for(let i=0;i<n/2;i++){
      const a=p[i], b=p[n-1-i]; if(!a||!b) continue;
      const flip = i===0 ? r%2===1 : i%2===1;
      pairs.push(flip?[b,a]:[a,b]);
    }
    base.push(pairs);
    p = [p[0], p[n-1], ...p.slice(1,n-1)];
  }
  const matches = {}; let n2=0;
  for(let c=0;c<cycles;c++){
    base.forEach((pairs,r)=>{
      pairs.forEach(([h,a])=>{
        const swap = c%2===1;
        const id = "m"+(n2++).toString().padStart(3,"0");
        matches[id] = {id, round: c*(n-1)+r+1, n:n2, home: swap?a:h, away: swap?h:a, played:false};
      });
    });
  }
  return {matches, rounds: cycles*(n-1)};
}

function standings(t){
  const ps = playersOf(t), rows = {};
  ps.forEach(id => rows[id] = {id, p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0,rem:0,form:[]});
  const ms = matchesOf(t);
  for(const m of ms){
    const H=rows[m.home], A=rows[m.away]; if(!H||!A) continue;
    if(!m.played){ H.rem++; A.rem++; continue; }
    H.p++;A.p++; H.gf+=m.hs;H.ga+=m.as;A.gf+=m.as;A.ga+=m.hs;
    if(m.hs>m.as){H.w++;A.l++;H.pts+=3;H.form.push("W");A.form.push("L");}
    else if(m.hs<m.as){A.w++;H.l++;A.pts+=3;A.form.push("W");H.form.push("L");}
    else{H.d++;A.d++;H.pts++;A.pts++;H.form.push("D");A.form.push("D");}
  }
  let list = Object.values(rows); list.forEach(r=>r.gd=r.gf-r.ga);
  // group by points, then apply head-to-head (direct results) inside each tied group
  list.sort((a,b)=>b.pts-a.pts);
  const out=[];
  for(let i=0;i<list.length;){
    let j=i; while(j<list.length && list[j].pts===list[i].pts) j++;
    const grp = list.slice(i,j);
    if(grp.length>1){
      const ids = new Set(grp.map(r=>r.id)), mini={};
      grp.forEach(r=>mini[r.id]={pts:0,gd:0,gf:0});
      ms.filter(m=>m.played && ids.has(m.home) && ids.has(m.away)).forEach(m=>{
        const h=mini[m.home],a=mini[m.away];
        h.gf+=m.hs;a.gf+=m.as;h.gd+=m.hs-m.as;a.gd+=m.as-m.hs;
        if(m.hs>m.as)h.pts+=3;else if(m.hs<m.as)a.pts+=3;else{h.pts++;a.pts++;}
      });
      grp.forEach(r=>r.h2h=mini[r.id]);
      grp.sort((a,b)=> b.h2h.pts-a.h2h.pts || b.h2h.gd-a.h2h.gd || b.h2h.gf-a.h2h.gf || b.gd-a.gd || b.gf-a.gf || pName(t,a.id).localeCompare(pName(t,b.id)));
    }
    out.push(...grp); i=j;
  }
  return out;
}
/* leader can't be caught even if he loses every remaining match */
function isClinched(rows){
  if(rows.length<2) return false;
  const L = rows[0];
  return rows.slice(1).every(r => r.pts + 3*r.rem < L.pts);
}
function allPlayed(t){ return matchesOf(t).every(m=>m.played); }

function canEdit(t,m){ const me=ME(); if(!me) return false; if(me.isAdmin) return true; if(t.status!=="active") return false; return sideHas(t,m.home,me.id) || sideHas(t,m.away,me.id); }

function notifMap(to, title, body, extra={}){
  const id = uid("n");
  return {["notifs/"+id]: {id, to, title, body, at:Date.now(), from: ME()?.id || null, ...extra}};
}

/* re-evaluate champion/completion after the roster changes */
function settle(tid){
  const t=DB.tournaments[tid]; if(!t || t.status!=="active") return;
  const ms=matchesOf(t), rows=standings(t), map={};
  if(rows.length<2) return;
  if(ms.length && ms.every(m=>m.played)){
    map[`tournaments/${tid}/status`]="finished"; map[`tournaments/${tid}/winner`]=rows[0].id; map[`tournaments/${tid}/finishedAt`]=Date.now();
    Object.assign(map, notifMap("all","🏆 "+pName(t,rows[0].id)+" win"+(isDuo(t)?"":"s")+" "+t.name+"!","All matches played."));
  } else {
    const want = isClinched(rows) ? rows[0].id : null;
    if(want !== (t.winner||null)){
      map[`tournaments/${tid}/winner`]=want; map[`tournaments/${tid}/clinchedAt`]=want?Date.now():null; map[`tournaments/${tid}/clinchAck`]=null;
      if(want) Object.assign(map, notifMap("all","👑 "+pName(t,want)+(isDuo(t)?" are":" is")+" the champion!",t.name));
    }
  }
  if(Object.keys(map).length) dbUpdate(map);
}
function removeParticipant(tid,pid){
  const t=DB.tournaments[tid], name=pName(t,pid), notifyTo=tUsers(t), map={};
  map[`tournaments/${tid}/players`]=playersOf(t).filter(x=>x!==pid);
  matchesOf(t).forEach(m=>{ if(m.home===pid||m.away===pid) map[`tournaments/${tid}/matches/${m.id}`]=null; });
  if(isDuo(t)) map[`tournaments/${tid}/teams/${pid}`]=null;
  Object.assign(map, notifMap(notifyTo, "➖ "+name+" left "+t.name, "Their matches were removed from the league."));
  dbUpdate(map); settle(tid);
}
/* new participant: catch-up fixtures vs everyone, one per matchday starting now */
function addParticipant(tid,pid,team){
  const t=DB.tournaments[tid], others=playersOf(t), ms=matchesOf(t), map={};
  const open=ms.filter(m=>!m.played), r0 = open.length ? Math.min(...open.map(m=>m.round)) : (ms.length?Math.max(...ms.map(m=>m.round))+1:1);
  let n = ms.length ? Math.max(...ms.map(m=>m.n||0)) : 0, k=0;
  const opp = shuffle(others);
  for(let c=0;c<(t.cycles||1);c++){
    opp.forEach((o,i)=>{
      const homeNew = (i+c)%2===0;
      const id="m"+Date.now().toString(36)+(k).toString().padStart(3,"0");
      // n:0.5-style ordering puts catch-up games first within their matchday
      map[`tournaments/${tid}/matches/${id}`]={id, round:r0+k, n:-(1000-k), home: homeNew?pid:o, away: homeNew?o:pid, played:false, catchup:true};
      k++;
    });
  }
  if(team) map[`tournaments/${tid}/teams/${pid}`]=team;
  map[`tournaments/${tid}/players`]=[...others,pid];
  const tmp={...t, teams:{...(t.teams||{}), ...(team?{[pid]:team}:{})}};
  const name=pName(tmp,pid);
  Object.assign(map, notifMap([...tUsers(t), ...members(tmp,pid)], "➕ "+name+" joined "+t.name, k+" catch-up matches added."));
  dbUpdate(map); settle(tid);
}

/* after any result: detect early champion / completion */
function postResult(tid, m){
  const t = DB.tournaments[tid]; if(!t) return;
  const rows = standings(t), map = {}, ps = tUsers(t);
  const H=pName(t,m.home), A=pName(t,m.away);
  Object.assign(map, notifMap(ps, "⚽ Result · "+t.name, `${H} ${m.hs} – ${m.as} ${A}`));
  if(t.status==="active"){
    if(allPlayed(t)){
      map[`tournaments/${tid}/status`]="finished";
      map[`tournaments/${tid}/winner`]=rows[0].id;
      map[`tournaments/${tid}/finishedAt`]=Date.now();
      if(!t.clinchedAt) map[`tournaments/${tid}/clinchedAt`]=Date.now();
      Object.assign(map, notifMap("all", "🏆 "+pName(t,rows[0].id)+" win"+(isDuo(t)?"":"s")+" "+t.name+"!", "All matches played. Final table is in."));
    } else if(!t.winner && isClinched(rows)){
      map[`tournaments/${tid}/winner`]=rows[0].id;
      map[`tournaments/${tid}/clinchedAt`]=Date.now();
      Object.assign(map, notifMap("all", "👑 "+pName(t,rows[0].id)+(isDuo(t)?" are":" is")+" the champion!", `Mathematically unreachable in ${t.name} — even losing every remaining match.`));
    } else if(t.winner && !isClinched(rows)){
      map[`tournaments/${tid}/winner`]=null; map[`tournaments/${tid}/clinchedAt`]=null; map[`tournaments/${tid}/clinchAck`]=null;
    }
  }
  dbUpdate(map);
}

}

/* ---------- PLAYERS ---------- */
function careerOf(id){
  const s={p:0,w:0,d:0,l:0,gf:0,ga:0};
  for(const t of tournaments()) for(const m of matchesOf(t)){
    if(!m.played) continue; const hh=sideHas(t,m.home,id), aa=sideHas(t,m.away,id); if(!hh&&!aa) continue;
    const f = hh ? m.hs : m.as, a = hh ? m.as : m.hs;
    s.p++; s.gf+=f; s.ga+=a; if(f>a)s.w++; else if(f<a)s.l++; else s.d++;
  }
  return s;
}

}

function sheetNewTour(){
  const sel = new Set(users().map(u=>u.id)); let cycles=2, mode="solo", rand=true, teams=[], pick=null;
  const num = tournaments().length+1;
  const selIds = () => users().map(u=>u.id).filter(id=>sel.has(id));
  const reshuffle = () => { teams = pairUp(selIds()); pick=null; };
  const syncManual = () => { // keep manual teams consistent with selection
    const ids=selIds(), used=new Set(teams.flat());
    teams = teams.map(p=>p.filter(id=>sel.has(id))).filter(p=>p.length);
    ids.filter(id=>!used.has(id)).forEach(id=>{ const open=teams.find(p=>p.length<2); open?open.push(id):teams.push([id]); });
    const singles=teams.filter(p=>p.length===1); teams=teams.filter(p=>p.length===2);
    for(let i=0;i<singles.length;i+=2) teams.push(singles[i+1]?[singles[i][0],singles[i+1][0]]:[singles[i][0]]);
  };
  const draw=()=>{
    if(mode==="duo"){ rand ? (teams.flat().length!==sel.size || teams.flat().some(id=>!sel.has(id)) ? reshuffle() : 0) : syncManual(); }
    const n = mode==="duo" ? Math.floor(sel.size/2) : sel.size, total = n*(n-1)/2*cycles;
    $("#ntbody").innerHTML = `
      <div class="field"><label>Mode</label>
        <div class="seg"><button class="${mode==="solo"?"on":""}" data-mode="solo">Solo</button><button class="${mode==="duo"?"on":""}" data-mode="duo">Duo</button></div></div>
      <div class="field"><label>Players</label>
        <div style="display:flex;flex-wrap:wrap;gap:8px">${users().map(u=>`<button class="chip ${sel.has(u.id)?"on":""}" data-p="${u.id}">${esc(u.name)}</button>`).join("")}</div></div>
      ${mode==="duo"?`
      <div class="field"><label>Teams</label>
        <div class="seg" style="margin-bottom:8px"><button class="${rand?"on":""}" data-rand="1">Random</button><button class="${!rand?"on":""}" data-rand="0">Manual</button></div>
        ${teams.map((p,i)=>`<div class="team"><span class="mut" style="width:18px">${i+1}</span>${p.map(id=>`<button class="chip ${pick===id?"on":""}" data-sw="${id}">${esc(U(id)?.name)}</button>`).join('<span class="mut">&</span>')}${p.length<2?'<span class="mut small">needs a partner</span>':""}</div>`).join("")}
        ${rand?`<button class="btn sm sec2" style="width:100%;margin-top:6px" data-reroll="1">Shuffle again</button>`:`<div class="small mut" style="margin-top:6px">Tap two players to swap them</div>`}
      </div>`:""}
      <div class="field"><label>Cycles</label>
        <div class="seg">${[1,2,3].map(v=>`<button class="${cycles===v?"on":""}" data-c="${v}">${v}</button>`).join("")}</div></div>
      <div class="small mut center" style="margin:14px 0">${total} matches</div>`;
    const B=$("#ntbody");
    B.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{ const id=b.dataset.p; sel.has(id)?sel.delete(id):sel.add(id); draw(); });
    B.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{ cycles=+b.dataset.c; draw(); });
    B.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{ mode=b.dataset.mode; if(mode==="duo") reshuffle(); draw(); });
    B.querySelectorAll("[data-rand]").forEach(b=>b.onclick=()=>{ rand=b.dataset.rand==="1"; if(rand) reshuffle(); pick=null; draw(); });
    B.querySelectorAll("[data-reroll]").forEach(b=>b.onclick=()=>{ reshuffle(); draw(); });
    B.querySelectorAll("[data-sw]").forEach(b=>b.onclick=()=>{
      const id=b.dataset.sw;
      if(rand){ rand=false; }
      if(!pick){ pick=id; }
      else if(pick===id){ pick=null; }
      else { const flat=teams.map(p=>[...p]); flat.forEach(p=>p.forEach((x,i)=>{ if(x===pick) p[i]=id; else if(x===id) p[i]=pick; })); teams=flat; pick=null; }
      draw();
    });
  };
  openSheet(`<div class="h it" style="font-size:26px;font-weight:700">New tournament</div>
    <div class="field"><label>Name</label><input class="inp" id="tname" value="Friday League #${num}"></div>
    <div id="ntbody"></div><div class="err" id="nterr"></div>
    <button class="btn" id="createt">Start</button>`);
  draw();
  $("#createt").onclick=()=>{
    const err=$("#nterr");
    const name=$("#tname").value.trim()||`Friday League #${num}`;
    const ids=selIds(), id=uid("t");
    let t;
    if(mode==="duo"){
      if(ids.length%2) return err.textContent="Duo needs an even number of players.";
      if(ids.length<4) return err.textContent="Pick at least 4 players.";
      const tm={}, pids=[];
      teams.forEach((p,i)=>{ const tid="d"+(i+1); tm[tid]={id:tid, members:p}; pids.push(tid); });
      const {matches,rounds}=schedule(pids,cycles);
      t={id,name,mode:"duo",teams:tm,players:pids,cycles,rounds,matches,status:"active",createdAt:Date.now(),createdBy:ME().id};
    } else {
      if(ids.length<2) return err.textContent="Pick at least 2 players.";
      const {matches,rounds}=schedule(ids,cycles);
      t={id,name,mode:"solo",players:ids,cycles,rounds,matches,status:"active",createdAt:Date.now(),createdBy:ME().id};
    }
    const first = Object.values(t.matches).sort((a,b)=>a.round-b.round||a.n-b.n)[0];
    const map={["tournaments/"+id]:t, ...notifMap(tUsers(t), "🏁 "+name+" has started!", `First match: ${pName(t,first.home)} vs ${pName(t,first.away)}`)};
    ui.tid=id; ui.view="home"; closeSheet(); dbUpdate(map); toast("Tournament created");
  };
}

function sheetManage(tid){
  const t=DB.tournaments[tid]; if(!t) return closeSheet();
  const inUsers=new Set(tUsers(t)), free=users().filter(u=>!inUsers.has(u.id));
  const pick = sheetManage.pick = (sheetManage.tid===tid ? sheetManage.pick : []) ; sheetManage.tid=tid;
  openSheet(`<div class="h it" style="font-size:24px;font-weight:700">Players</div>
    <div class="sec h">In tournament</div>
    ${playersOf(t).map(p=>`<div class="team" style="justify-content:space-between">
      <div class="row" style="gap:8px;min-width:0">${pAv(t,p,"sm")}<span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(pName(t,p))}</span></div>
      ${playersOf(t).length>2?`<button class="btn sm ghost" data-rm="${p}">Remove</button>`:""}</div>`).join("")}
    <div class="sec h">${isDuo(t)?"Add team":"Add player"}</div>
    ${free.length? `<div style="display:flex;flex-wrap:wrap;gap:8px">${free.map(u=>`<button class="chip ${pick.includes(u.id)?"on":""}" data-add="${u.id}">${esc(u.name)}</button>`).join("")}</div>
      ${isDuo(t)?`<div class="row" style="margin-top:10px"><button class="btn sm sec2 grow" style="width:100%" data-randpair="1" ${free.length<2?"disabled":""}>Random pair</button><button class="btn sm grow" style="width:100%" data-addteam="1" ${pick.length!==2?"disabled style='opacity:.5;width:100%'":""}>Add team</button></div>`:""}`
      : `<div class="small mut">Everyone is already in</div>`}`);
  $("#modal").querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{ const p=b.dataset.rm;
    sheetConfirm(`Remove ${esc(pName(t,p))}?`,"","Remove",()=>{ removeParticipant(tid,p); toast("Removed"); },true); });
  $("#modal").querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>{ const id=b.dataset.add;
    if(!isDuo(t)){ sheetConfirm(`Add ${esc(U(id).name)}?`,"","Add",()=>{ addParticipant(tid,id); toast("Added"); }); return; }
    const i=pick.indexOf(id); i>=0?pick.splice(i,1):(pick.length<2&&pick.push(id)); sheetManage(tid); });
  const rp=$("[data-randpair]"); if(rp) rp.onclick=()=>{ const [a,b]=shuffle(free.map(u=>u.id)); sheetManage.pick=[a,b]; sheetManage(tid); };
  const at=$("[data-addteam]"); if(at) at.onclick=()=>{ if(pick.length!==2) return;
    const nums=Object.keys(t.teams||{}).map(k=>parseInt(k.slice(1))||0), tid2="d"+(Math.max(0,...nums)+1);
    const team={id:tid2, members:[...pick]}; sheetManage.pick=[];
    sheetConfirm(`Add ${esc(U(pick[0]).name)} & ${esc(U(pick[1]).name)}?`,"","Add team",()=>{ addParticipant(tid,tid2,team); toast("Team added"); }); };
}

function sheetNotifs(){
  const me=ME(), list=myNotifs().slice(0,40), un=unread();
  openSheet(`<div class="h it" style="font-size:26px;font-weight:700;margin-bottom:8px">Notifications</div>
    ${list.length? list.map(n=>`<div class="li" style="cursor:default;${!(n.read&&n.read[me.id])?"border-color:color-mix(in srgb,var(--a2) 60%,transparent)":""}">
      <div class="grow"><div class="nm" style="font-size:14px">${esc(n.title)}</div><div class="small mut">${esc(n.body)}</div></div>
      </div>`).join("") : `<div class="empty mut">Nothing yet.</div>`}`);
  if(un.length){ const map={}; un.forEach(n=>map[`notifs/${n.id}/read/${me.id}`]=true); dbUpdate(map); }
}

function sheetAddUser(){
  openSheet(`<div class="h it" style="font-size:26px;font-weight:700">Add player</div>
    <div class="field"><label>Name</label><input class="inp" id="uname" autofocus></div>
    
    <div class="err" id="uerr"></div><button class="btn" id="saveu">Add player</button>`);
  $("#saveu").onclick=()=>{
    const name=$("#uname").value.trim(); if(!name) return $("#uerr").textContent="Enter a name.";
    if(users().some(u=>u.name.toLowerCase()===name.toLowerCase())) return $("#uerr").textContent="That name already exists.";
    let id="u_"+slug(name); if(U(id)) id=uid("u");
    dbUpdate({["users/"+id]:{id,name,isAdmin:false,order:Date.now(),createdAt:Date.now()}}); closeSheet(); toast(name+" added");
  };
}
function sheetChangePw(){
  const me=ME();
  openSheet(`<div class="h it" style="font-size:26px;font-weight:700">Change password</div>
    <div class="field"><label>Current</label><input class="inp" type="password" id="cp0"></div>
    <div class="field"><label>New</label><input class="inp" type="password" id="cp1"></div>
    <div class="field"><label>Confirm</label><input class="inp" type="password" id="cp2"></div>
    <div class="err" id="cperr"></div><button class="btn" id="savecp">Update</button>`);
  $("#savecp").onclick=()=>{
    const e=$("#cperr");
    if(hashPw(me.id,$("#cp0").value)!==me.pass) return e.textContent="Current password is wrong.";
    if($("#cp1").value.length<4) return e.textContent="Use at least 4 characters.";
    if($("#cp1").value!==$("#cp2").value) return e.textContent="Passwords don't match.";
    dbUpdate({[`users/${me.id}/pass`]:hashPw(me.id,$("#cp1").value)}); closeSheet(); toast("Password updated");
  };
}
function sheetConfirm(title, text, okLabel, fn, danger){
  openSheet(`<div class="h it" style="font-size:22px;font-weight:700;margin-bottom:16px">${title}</div>
    <button class="btn ${danger?"danger":""}" id="okc">${okLabel}</button><button class="btn ghost" style="margin-top:8px" data-a="close">Cancel</button>`);
  $("#okc").onclick=()=>{ closeSheet(); fn(); };
}
function finishTour(id){
  const t=DB.tournaments[id], rows=standings(t), w=t.winner||rows[0].id;
  dbUpdate({[`tournaments/${id}/status`]:"finished",[`tournaments/${id}/winner`]:w,[`tournaments/${id}/finishedAt`]:Date.now(),
    ...notifMap("all","🏆 "+pName(t,w)+" win"+(isDuo(t)?"":"s")+" "+t.name+"!","The admin closed the tournament.")});
}

/* ================= EVENTS ================= */
document.addEventListener("click", e=>{
  const el=e.target.closest("[data-a]"); if(!el) return;
  const a=el.dataset.a, id=el.dataset.id;
  if(a==="closebg"){ if(e.target===el) closeSheet(); return; }
  switch(a){
    case "close": closeSheet(); break;
    case "manage": sheetManage.pick=[]; sheetManage(id); break;
    case "toggleup": ui.allUp=!ui.allUp; render(); break;
    case "pickuser": ui.login={step:"pass",user:id}; render(); break;
    case "loginback": ui.login={step:"pick"}; render(); break;
    case "nav": ui.view=el.dataset.v; ui.profile=null; render(); scrollTo(0,0); break;
    case "back": ui.profile=null; render(); break;
    case "profile": ui.profile=id; render(); scrollTo(0,0); break;
    case "notifs": sheetNotifs(); break;
    case "newtour": sheetNewTour(); break;
    case "score": sheetScore(el.dataset.t, el.dataset.m); break;
    case "seltour": ui.tid=id; render(); break;
    case "gotable": ui.tid=id; ui.view="table"; ui.profile=null; render(); scrollTo(0,0); break;
    case "mfilter": ui.mfilter=el.dataset.v; render(); break;
    case "adduser": sheetAddUser(); break;
    case "changepw": sheetChangePw(); break;
    case "logout": me_id=null; localStorage.removeItem("fl_me"); ui.profile=null; render(); break;
    case "theme": localStorage.setItem("fl_theme",el.dataset.v); render(); break;
    case "enablenotif": if("Notification" in window) Notification.requestPermission().then(()=>render()); break;
    case "ackclinch": dbUpdate({[`tournaments/${id}/clinchAck`]:true}); toast("Remaining matches stay open"); break;
    case "finish": sheetConfirm("Finish tournament?", "", "Finish & crown champion", ()=>finishTour(id)); break;
    case "resetpw": sheetConfirm("Reset password?", `${esc(U(id).name)} will set a new password the next time they log in.`, "Reset", ()=>{ dbUpdate({[`users/${id}/pass`]:null}); toast("Password reset"); }); break;
    case "toggleadmin": { const u=U(id); if(u.id===ME().id) return; dbUpdate({[`users/${id}/isAdmin`]:!u.isAdmin}); break; }
    case "tmenu": { const t=DB.tournaments[id];
      openSheet(`<div class="h it" style="font-size:24px;font-weight:700">${esc(t.name)}</div>
        ${t.status==="active"?`<button class="btn sec2" style="margin-top:12px" id="tm_manage">Manage players</button><button class="btn sec2" style="margin-top:8px" id="tm_finish">Finish now</button>`:`<button class="btn sec2" style="margin-top:12px" id="tm_reopen">Reopen tournament</button>`}
        <button class="btn danger" style="margin-top:8px" id="tm_del">Delete tournament</button>`);
      const mg=$("#tm_manage"); if(mg) mg.onclick=()=>{ sheetManage.pick=[]; sheetManage(id); };
      const f=$("#tm_finish"); if(f) f.onclick=()=>{ closeSheet(); el.dataset.a="finish"; sheetConfirm("Finish tournament?","The current leader will be crowned. Unplayed matches stay unplayed.","Finish",()=>finishTour(id)); };
      const r=$("#tm_reopen"); if(r) r.onclick=()=>{ closeSheet(); const rows=standings(t); dbUpdate({[`tournaments/${id}/status`]:"active",[`tournaments/${id}/finishedAt`]:null,[`tournaments/${id}/winner`]:isClinched(rows)?rows[0].id:null}); };
      $("#tm_del").onclick=()=>sheetConfirm("Delete tournament?","This removes all its matches and stats. Can't be undone.","Delete",()=>{ ui.tid=null; dbUpdate({["tournaments/"+id]:null}); },true);
      break; }
  }
});

render();
startData();


/* ===== fullscreen-only + no zoom ===== */
(function(){
  const block = e => e.preventDefault();
  ["gesturestart","gesturechange","gestureend"].forEach(t=>document.addEventListener(t,block,{passive:false})); // iOS pinch
  document.addEventListener("touchmove", e=>{ if(e.touches.length>1) e.preventDefault(); }, {passive:false});
  let lastTouch=0; document.addEventListener("touchend", e=>{ const n=Date.now(); if(n-lastTouch<300 && !e.target.closest("input,select,textarea")) e.preventDefault(); lastTouch=n; }, {passive:false});
  document.addEventListener("wheel", e=>{ if(e.ctrlKey) e.preventDefault(); }, {passive:false});
  document.addEventListener("keydown", e=>{ if((e.ctrlKey||e.metaKey) && ["+","-","=","0","_"].includes(e.key)) e.preventDefault(); });
  // when opened in a normal browser tab, go fullscreen on the first tap
  const standalone = matchMedia("(display-mode: fullscreen)").matches || matchMedia("(display-mode: standalone)").matches || navigator.standalone;
  const goFull = () => {
    const el=document.documentElement, req=el.requestFullscreen||el.webkitRequestFullscreen;
    if(!document.fullscreenElement && !document.webkitFullscreenElement && req){ try{ const p=req.call(el,{navigationUI:"hide"}); if(p&&p.catch) p.catch(()=>{}); }catch(_){} }
  };
  if(!standalone){ document.addEventListener("pointerup", goFull, {passive:true}); }
})();

if("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(()=>{});
